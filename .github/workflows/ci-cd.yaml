name: CI/CD Pipeline - Online Boutique

on:
  push:
    branches:
      - main
    paths:
      - 'app/src/**'
      - 'gitops/helm-chart/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Specific microservice to build (leave empty to detect changes)'
        required: false
        default: ''

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: write   # Required for GitOps tag update commits
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'online-boutique' }}

jobs:
  detect-changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
      count: ${{ steps.filter.outputs.count }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify Modified Services
        id: filter
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.service }}" ]; then
            echo "Building explicitly requested service: ${{ github.event.inputs.service }}"
            SERVICES_JSON=$(jq -c -n --arg svc "${{ github.event.inputs.service }}" '[$svc]')
            echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
            echo "count=1" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Microservices list
          ALL_SERVICES=("frontend" "cartservice" "productcatalogservice" "currencyservice" "paymentservice" "shippingservice" "emailservice" "checkoutservice" "recommendationservice" "adservice" "loadgenerator")
          
          CHANGED_SERVICES=()

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files 'app/src')
          fi

          for svc in "${ALL_SERVICES[@]}"; do
            if echo "$DIFF_FILES" | grep -q "^app/src/$svc/"; then
              CHANGED_SERVICES+=("$svc")
            fi
          done

          # Default to all if triggered on first push or no diff detected
          if [ ${#CHANGED_SERVICES[@]} -eq 0 ] && [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CHANGED_SERVICES=("${ALL_SERVICES[@]}")
          fi

          SERVICES_JSON=$(printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -R . | jq -s -c .)
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
          echo "count=${#CHANGED_SERVICES[@]}" >> $GITHUB_OUTPUT
          echo "Detected changed services: $SERVICES_JSON"

  build-scan-push:
    name: Build, Scan & Push
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.count > 0 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Microservice Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/src/${{ matrix.service }}
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:latest

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:latest

  update-gitops:
    name: Update GitOps Tag (values-dev.yaml)
    needs: [detect-changes, build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.count > 0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm Image Tag in values-dev.yaml
        shell: bash
        run: |
          DEV_VALUES="gitops/helm-chart/values-dev.yaml"
          echo "Updating tag in $DEV_VALUES to ${{ github.sha }}..."
          
          # Update images.tag in values-dev.yaml using sed
          sed -i -E "s/([[:space:]]*tag:[[:space:]]*).*/\1\"${{ github.sha }}\"/" "$DEV_VALUES"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "$DEV_VALUES"
          if git diff --staged --quiet; then
            echo "No changes in values-dev.yaml"
          else
            git commit -m "chore(gitops): promote image tag to ${{ github.sha }} in dev [skip ci]"
            git push origin main
          fi
