services:
  redis-cart:
    image: redis:7-alpine
    container_name: redis-cart
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  emailservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice:v0.10.1
    build:
      context: ./src/emailservice
    container_name: emailservice
    restart: unless-stopped
    environment:
      - PORT=8080
      - DISABLE_PROFILER=1
    ports:
      - "8081:8080"

  checkoutservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice:v0.10.1
    build:
      context: ./src/checkoutservice
    container_name: checkoutservice
    restart: unless-stopped
    environment:
      - PORT=5050
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:8080
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - DISABLE_PROFILER=1
    ports:
      - "5050:5050"
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice

  recommendationservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice:v0.10.1
    build:
      context: ./src/recommendationservice
    container_name: recommendationservice
    restart: unless-stopped
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - DISABLE_PROFILER=1
    ports:
      - "8082:8080"
    depends_on:
      - productcatalogservice

  frontend:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend:v0.10.1
    build:
      context: ./src/frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - AD_SERVICE_ADDR=adservice:9555
      - ENV_PLATFORM=local
      - DISABLE_PROFILER=1
    ports:
      - "8080:8080"
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice

  paymentservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice:v0.10.1
    build:
      context: ./src/paymentservice
    container_name: paymentservice
    restart: unless-stopped
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
    ports:
      - "50052:50051"

  productcatalogservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice:v0.10.1
    build:
      context: ./src/productcatalogservice
    container_name: productcatalogservice
    restart: unless-stopped
    environment:
      - PORT=3550
      - DISABLE_PROFILER=1
    ports:
      - "3550:3550"

  cartservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice:v0.10.1
    build:
      context: ./src/cartservice
    container_name: cartservice
    restart: unless-stopped
    environment:
      - PORT=7070
      - REDIS_ADDR=redis-cart:6379
      - DISABLE_PROFILER=1
    ports:
      - "7070:7070"
    depends_on:
      redis-cart:
        condition: service_healthy

  loadgenerator:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator:v0.10.1
    build:
      context: ./src/loadgenerator
    container_name: loadgenerator
    restart: unless-stopped
    environment:
      - FRONTEND_ADDR=frontend:8080
      - USERS=10
    depends_on:
      - frontend

  currencyservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice:v0.10.1
    build:
      context: ./src/currencyservice
    container_name: currencyservice
    restart: unless-stopped
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1
    ports:
      - "7000:7000"

  shippingservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shippingservice:v0.10.1
    build:
      context: ./src/shippingservice
    container_name: shippingservice
    restart: unless-stopped
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
    ports:
      - "50053:50051"

  adservice:
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice:v0.10.1
    build:
      context: ./src/adservice
    container_name: adservice
    restart: unless-stopped
    environment:
      - PORT=9555
      - DISABLE_PROFILER=1
    ports:
      - "9555:9555"
