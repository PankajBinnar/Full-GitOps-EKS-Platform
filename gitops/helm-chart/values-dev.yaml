# Environment: Development
# Sized to run comfortably on 2-3 t3.medium or t3.large EC2 worker nodes

images:
  repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo
  tag: ""

# Disable Classic Load Balancer in favor of AWS ALB Ingress
frontend:
  externalService: false
  platform: aws
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# AWS Load Balancer Controller Ingress configuration
ingress:
  enabled: true
  ingressClassName: alb
  scheme: internet-facing
  targetType: ip
  certificateArn: ""
  healthcheckPath: /_healthz
  annotations:
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=60
  hosts: []

# Load generator disabled in dev by default to conserve cluster resources
loadGenerator:
  create: false
  enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Right-sized microservice resources for Dev
